syntax = "proto3";

package tether.v1;

// The whole SDK surface. The agent's loop stays in the user's code; it calls
// Complete and CallTool instead of a provider SDK and its own tool functions.
// No logic lives in an SDK beyond type mapping.
service Tether {
  rpc CreateRun(CreateRunRequest) returns (Run);
  // Agent asks for a model turn.
  rpc Complete(ModelRequest) returns (ModelResponse);
  // Agent asks for a tool. Policy, sandbox and trace all happen here.
  rpc CallTool(ToolCallRequest) returns (ToolResult);
  // Tail the trace.
  rpc Events(RunRef) returns (stream Event);
  // Resolve a policy.ask.
  rpc Answer(AskAnswer) returns (Empty);
  rpc Halt(RunRef) returns (Empty);
}

message Empty {}

message RunRef { string run_id = 1; }

message CreateRunRequest {
  string agent = 1;
  string policy_path = 2;
  string sandbox = 3;       // process | docker | firecracker
  string workspace = 4;
}

message Run {
  string run_id = 1;
  string trace_path = 2;
  repeated ToolSpec tools = 3;
}

message ToolSpec {
  string name = 1;
  string server = 2;
  string description = 3;
  string input_schema_json = 4;
}

message ModelRequest {
  string run_id = 1;
  string model = 2;
  string messages_json = 3;   // provider-neutral messages, JSON
  repeated string tools = 4;
  string params_json = 5;
}

message ModelResponse {
  string message_json = 1;
  repeated ToolCall tool_calls = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  uint64 latency_ms = 5;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string arguments_json = 3;
}

message ToolCallRequest {
  string run_id = 1;
  ToolCall call = 2;
}

message ToolResult {
  string id = 1;
  string content_json = 2;
  bool is_error = 3;
  uint64 duration_ms = 4;
}

message Event {
  uint64 seq = 1;
  string type = 2;
  string json = 3;           // the full event line
}

message AskAnswer {
  string run_id = 1;
  uint64 subject_seq = 2;
  bool allow = 3;
  string answered_by = 4;
}
